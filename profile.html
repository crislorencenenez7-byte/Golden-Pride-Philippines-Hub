<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Golden Pride Hub</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-auth="required">

  <div id="loading-screen"><div class="spinner"></div></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
        <span>Golden Pride Hub</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        <a href="members.html"><i class="fa-solid fa-users"></i> Members</a>
        <a href="events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
        <a href="gallery.html"><i class="fa-solid fa-images"></i> Gallery</a>
        <a href="achievements.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="admin.html" class="admin-only" style="display:none;"><i class="fa-solid fa-user-shield"></i> Admin Panel</a>
        <a href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </nav>
      <div class="sidebar-user">
        <div class="avatar-circle user-avatar-initials"></div>
        <div class="sidebar-user-info">
          <span class="user-fullname">Loading…</span>
          <span class="user-role-badge badge-member"></span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <button class="sidebar-toggle" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
        <h1>My Profile</h1>
      </div>

      <div class="profile-header">
        <div class="profile-photo-wrap">
          <img id="profile-photo" src="" alt="Profile photo" onerror="this.src='https://via.placeholder.com/96/1c1c1c/ffd700?text=GP'">
          <label class="profile-photo-edit" for="profile-photo-input"><i class="fa-solid fa-camera"></i></label>
          <input type="file" id="profile-photo-input" accept="image/*" hidden>
        </div>
        <div>
          <h2 class="user-fullname">Loading…</h2>
          <span class="user-role-badge badge-member"></span>
        </div>
      </div>

      <div class="glass" style="max-width:480px; padding:28px;">
        <form id="profile-form" novalidate>
          <div class="form-group">
            <label for="profile-fullname">Full Name</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="profile-fullname" required>
            </div>
          </div>

          <div class="form-group">
            <label for="profile-email">Email Address</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="profile-email" disabled>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </form>
      </div>
    </main>
  </div>

  <button id="scroll-top" aria-label="Scroll to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

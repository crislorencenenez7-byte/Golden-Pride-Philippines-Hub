<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Golden Pride Hub</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<!-- data-auth="guest" redirects already-logged-in users to the dashboard -->
<body class="auth-page" data-auth="guest">

  <div id="loading-screen"><div class="spinner"></div></div>

  <div class="auth-box glass fade-in">
    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <div class="auth-logo">
      <img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      <span>Golden Pride <span class="text-gold">Hub</span></span>
    </div>

    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Log in to your member account</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" required placeholder="••••••••">
          <i class="fa-solid fa-eye toggle-password" data-target="password"></i>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-wrap">
          <input type="checkbox" id="remember-me">
          Remember Me
        </label>
        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-right-to-bracket"></i> Log In
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.querySelectorAll(".toggle-password").forEach((icon) => {
      icon.addEventListener("click", () => {
        const input = document.getElementById(icon.dataset.target);
        input.type = input.type === "password" ? "text" : "password";
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Golden Pride Hub</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">

  <div id="loading-screen"><div class="spinner"></div></div>

  <div class="auth-box glass fade-in">
    <a href="login.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>

    <div class="auth-logo">
      <img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      <span>Golden Pride <span class="text-gold">Hub</span></span>
    </div>

    <h2>Reset Password</h2>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

    <form id="forgot-password-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <p class="auth-footer">Remembered your password? <a href="login.html">Log in here</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

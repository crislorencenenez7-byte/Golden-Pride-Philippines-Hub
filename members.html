<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members | Golden Pride Hub</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-auth="required">

  <div id="loading-screen"><div class="spinner"></div></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
        <span>Golden Pride Hub</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        <a href="members.html" class="active"><i class="fa-solid fa-users"></i> Members <span id="nav-msg-badge" class="nav-badge" style="display:none;"></span></a>
        <a href="events.html"><i class="fa-solid fa-calendar-days"></i> Events</a>
        <a href="gallery.html"><i class="fa-solid fa-images"></i> Gallery</a>
        <a href="achievements.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="admin.html" class="admin-only" style="display:none;"><i class="fa-solid fa-user-shield"></i> Admin Panel</a>
        <a href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </nav>
      <div class="sidebar-user">
        <div class="avatar-circle user-avatar-initials"></div>
        <div class="sidebar-user-info">
          <span class="user-fullname">Loading…</span>
          <span class="user-role-badge badge-member"></span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <button class="sidebar-toggle" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
        <h1>Members</h1>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="member-search" placeholder="Search members by name…">
        </div>
      </div>

      <div id="members-grid" class="grid grid-4"></div>
    </main>
  </div>

  <!-- Inline Chat Modal — opens directly from a member's "Message" button -->
  <div id="member-chat-overlay" class="member-chat-overlay">
    <div class="member-chat-modal glass">
      <div class="chat-header">
        <button class="chat-back-btn" id="member-chat-close" style="display:block;"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="avatar-circle" id="member-chat-avatar"></div>
        <div>
          <strong id="member-chat-name">—</strong>
          <span id="member-chat-status" class="chat-partner-status">—</span>
        </div>
      </div>
      <div class="chat-messages" id="member-chat-messages"></div>
      <form class="chat-input-row" id="member-chat-form">
        <input type="text" id="member-chat-input" placeholder="Type a message…" maxlength="1000" autocomplete="off" required>
        <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>

  <button id="scroll-top" aria-label="Scroll to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
